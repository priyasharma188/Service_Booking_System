<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#sbsGradient)" stroke="white" stroke-width="3"/>
  
  <!-- Inner white circle -->
  <circle cx="100" cy="100" r="85" fill="white"/>
  
  <!-- Service icon - simplified gear -->
  <g transform="translate(100, 75)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#1e40af" stroke-width="3"/>
    <!-- Gear teeth -->
    <rect x="-2" y="-23" width="4" height="6" fill="#1e40af"/>
    <rect x="-2" y="17" width="4" height="6" fill="#1e40af"/>
    <rect x="-23" y="-2" width="6" height="4" fill="#1e40af"/>
    <rect x="17" y="-2" width="6" height="4" fill="#1e40af"/>
    <!-- Inner dot -->
    <circle cx="0" cy="0" r="8" fill="#2563eb"/>
  </g>
  
  <!-- Network nodes -->
  <g transform="translate(100, 120)">
    <circle cx="-15" cy="0" r="4" fill="#1e40af"/>
    <circle cx="15" cy="0" r="4" fill="#1e40af"/>
    <circle cx="0" cy="14" r="4" fill="#1e40af"/>
    <line x1="-12" y1="2" x2="0" y2="10" stroke="#2563eb" stroke-width="2"/>
    <line x1="12" y1="2" x2="0" y2="10" stroke="#2563eb" stroke-width="2"/>
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#2563eb" stroke-width="2"/>
  </g>
  
  <!-- SBS Text -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e40af" text-anchor="middle" letter-spacing="2">SBS</text>
</svg>